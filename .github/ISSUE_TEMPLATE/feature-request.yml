name: Feature request
description: Suggest a new feature or improvement for Venumity UI
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        We love ideas
        Use this form to suggest a new feature or enhancement for **Venumity UI**.

  - type: textarea
    id: summary
    attributes:
      label: Feature summary
      description: Briefly describe the feature or improvement.
      placeholder: What would you like to see added ?
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Checklist
      options:
        - label: I have checked existing issues and feature requests.
          required: true
        - label: This feature aligns with Venumity UI’s goals and scope.
          required: true
        - label: I have clearly explained the value of this feature.
          required: true