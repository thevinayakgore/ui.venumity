name: Feature Request
description: Suggest an idea for this project
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible.

  - type: dropdown
    id: component-category
    attributes:
      label: Component Category
      description: Which category does this feature relate to?
      options:
        - General Improvement
        - New Component
        - Feedbacks
        - Layout
        - Forms
        - Navigation
        - Data Display
        - Others
    validations:
      required: true

  - type: input
    id: component-subcategory
    attributes:
      label: Component Subcategory
      description: Which specific component type?
      placeholder: e.g., Alert, Button, Card
    validations:
      required: false

  - type: input
    id: component-name
    attributes:
      label: Component Name
      description: Full name of the component (if existing)
      placeholder: e.g., Standard Alert, Primary Button
    validations:
      required: false

  - type: input
    id: component-path
    attributes:
      label: Component Path
      description: Path to the component in the registry (if existing)
      placeholder: e.g., feedbacks/alert/standard-alert

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work?
      placeholder: Describe your ideal solution...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered?
      placeholder: Other ways to solve this problem...
    validations:
      required: false

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Who would use this feature and how?
      placeholder: |
        Example use cases:
        - As a developer, I want to...
        - As a designer, I need to...
        - As a user, I expect to...
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Ideas
      description: Any thoughts on how to implement this?
      placeholder: Technical details, libraries, approaches...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or references here.
      placeholder: |
        - Links to similar features in other projects
        - Mockups or wireframes
        - User research data
        - Screenshots
    validations:
      required: false

  - type: textarea
    id: priority
    attributes:
      label: Priority
      description: Why is this feature important?
      placeholder: Explain the impact and urgency...
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/thevinayakgore/ui.venumity/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true